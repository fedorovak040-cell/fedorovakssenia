
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1 - Домик в деревне</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="scene">
        
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        
        <div class="ground"></div>
        <div class="path"></div>

        
        <div class="house">
            <div class="roof"></div>
            <div class="chimney">
                <div class="smoke s1"></div>
                <div class="smoke s2"></div>
                <div class="smoke s3"></div>
            </div>
            <div class="base">
                <div class="door"></div>
                <div class="window w1">
                    <div class="cross-v"></div>
                    <div class="cross-h"></div>
                </div>
                <div class="window w2">
                    <div class="cross-v"></div>
                    <div class="cross-h"></div>
                </div>
            </div>
        </div>

        <!-- Деревья -->
        <div class="tree tree1">
            <div class="trunk"></div>
            <div class="leaves l1"></div>
            <div class="leaves l2"></div>
            <div class="leaves l3"></div>
        </div>
        <div class="tree tree2">
            <div class="trunk"></div>
            <div class="leaves l1"></div>
            <div class="leaves l2"></div>
            <div class="leaves l3"></div>
        </div>

        <!-- Забор -->
        <div class="fence">
            <div class="plank"></div>
            <div class="plank"></div>
            <div class="plank"></div>
            <div class="plank"></div>
            <div class="plank"></div>
            <div class="plank"></div>
            <div class="plank"></div>
            <div class="plank"></div>
        </div>
    </div>

</body>
</html>
